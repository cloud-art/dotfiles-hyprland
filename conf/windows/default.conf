# -----------------------------------------------------
# General window layout and colors
# name: "Default"
# -----------------------------------------------------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = $on_surface
    col.inactive_border = $outline
    layout = dwindle
    resize_on_border = true

}

decoration {
    rounding = 12
}